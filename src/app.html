<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbitty</title>
    <script>
      // Pre-paint theme follows the OS so the transparent window never flashes
      // unstyled; the app replaces this with the saved theme once loaded.
      document.documentElement.dataset.theme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "systemDark"
        : "systemLight";
      // Kill WKWebView's default context menu (Reload / Back / Forward / …).
      // App-owned oncontextmenu handlers still run; AppKit planet menus are
      // native and untouched. Also refuse ⌘R / Ctrl+R page reload.
      document.addEventListener(
        "contextmenu",
        (e) => e.preventDefault(),
        true,
      );
      document.addEventListener(
        "keydown",
        (e) => {
          if ((e.metaKey || e.ctrlKey) && (e.key === "r" || e.key === "R")) {
            e.preventDefault();
          }
        },
        true,
      );
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
