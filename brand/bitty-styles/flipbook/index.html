<h1>What to watch</h1>
<p>Ignore the pretty stills. Watch the <b>feet / paws</b>. A town walk is a small swap: one foot forward, then the other. Same clothes and face in all four. Too still = photocopies. Too much = spinning, jumping, or turning to face you.</p>
