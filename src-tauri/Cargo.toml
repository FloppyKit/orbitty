[package]
name = "orbitty"
version = "0.1.0"
description = "Orbitty — runtime consolidator (Tauri)"
authors = ["Orbitty"]
edition = "2021"
license = "Apache-2.0"
default-run = "orbitty"

[lib]
name = "orbitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orbitty"
path = "src/main.rs"

# GO-ORBITTY-CONTROL-PLANE-0: the control-socket client. Pure std +
# serde_json — never links Tauri, never opens a WebView.
[[bin]]
name = "orbittyctl"
path = "src/bin/orbittyctl.rs"

# GO-ORBITTY-MCP-0: thin stdio MCP adapter over the same socket.
# Pure std + serde_json — never links Tauri, never opens a WebView.
[[bin]]
name = "orbitty-mcp"
path = "src/bin/orbitty_mcp.rs"

# GO-ORBITTY-RELAY-SIDECAR: loopback NIP-01 sidecar. Never links the
# habitat; jsonl SoT stays in the app. No rusqlite in this crate.
[[bin]]
name = "orbitty-relay"
path = "src/bin/orbitty_relay/main.rs"

[features]
# Matt's THIN debug/testing stamp (⌘⌥T). Debug builds have it anyway;
# install-nightly.sh builds Nightly with it. Stable/consumer builds never do.
dev-thin = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# protocol-asset: GO-ORBITTY-COMPANION-3D serves the bundled GLBs via
# convertFileSrc (scope $RESOURCE/companion/3d/**) — never a data-URL.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GO headers are YAML front matter (GO-ORBITTY-GO-STANDARD).
serde_yaml = "0.9"
# GO-ORBITTY-MCP-WRITE: local calendar day key for the points daily cap
# (board.rs today_key, same as the frontend todayKey()). Minimal features —
# no wasm/serde extras.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "alloc"] }
# Pack zip import (GO-LS-TAURI-USER-PACKS): extraction only, deflate covers
# the classic sprite-pack zip; no crypto/other codecs. GO-ORBITTY-CHARS:
# no HTTP client — sprite art is generated (chars.rs) or imported locally.
zip = { version = "2", default-features = false, features = ["deflate"] }
# GO-ORBITTY-EVENT-KEYS: local NIP-01 id + schnorr. No relay, no sqlite.
sha2 = "0.10"
secp256k1 = { version = "0.29", default-features = false, features = ["std", "alloc"] }
# Loopback websocket: orbitty-relay server, habitat best-effort EVENT client.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc = "0.2"
window-vibrancy = "0.6"

[profile.release]
# Unwind, not abort: habitat wraps its AppKit work in catch_unwind so a
# native failure can never take down the rail.
panic = "unwind"
opt-level = "z"
codegen-units = 1
lto = true
# GO-ORBITTY-SHIP-SLIM: LTO was already on; strip is the missing half of
# the release diet (copy test: 15MB -> 13MB binary).
strip = true
