<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #14181c; color: #d7dde3; font: 13px/1.4 -apple-system, sans-serif; width: 260px; }
    main { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    h1 { margin: 0; font-size: 14px; font-weight: 600; }
    select, button { background: #1e252b; color: #d7dde3; border: 1px solid #2c3640; border-radius: 6px; padding: 6px 8px; }
    button { cursor: pointer; }
    button:hover { background: #26303a; }
    #note { min-height: 1.2em; color: #9aa6b2; }
  </style>
</head>
<body>
  <main>
    <h1>Tabbity</h1>
    <select id="planet"></select>
    <button id="claim" type="button">Claim this tab</button>
    <button id="all" type="button">Claim all tabs in this window</button>
    <button id="release" type="button">Release</button>
    <div id="note"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
